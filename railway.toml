[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only what goes into the image. Without this every push -- docs, tests, Nix
# files -- rebuilds and redeploys, and with a volume attached a redeploy is a
# short outage.
watchPatterns = ["src/**", "resources/**", "deps.edn", "build.clj", "Dockerfile", "railway.toml"]

[deploy]
healthcheckPath = "/health"
