# Railway config for the boost bot service.
#
# Point the bot service's "Config-as-code file path" at this file instead of
# railway.toml. Same repo, same Dockerfile, same boostbox.jar -- only the
# entry point differs.
#
# It must not share railway.toml: that sets healthcheckPath = "/health", and
# the bot serves no HTTP at all. Railway would probe a port that does not
# exist, mark the deploy unhealthy, and restart it forever.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
# Only what goes into the image, so a docs-only push does not restart the bot.
watchPatterns = ["src/**", "resources/**", "deps.edn", "build.clj", "Dockerfile", "railway.bot.toml"]

[deploy]
# The Dockerfile CMD starts the web app; the bot is a second -main in the same
# uberjar.
#
# The heap is capped for the same reason as the web app's (Railway bills memory
# by the minute), lower because the bot draws no banners; its largest single
# read is a 2 MB feed. SerialGC rather than the web app's G1: the bot has no
# bursts to give memory back after, and Serial's bookkeeping is ~55 MB less.
#
# ExitOnOutOfMemoryError matters more here than there: nothing in the bot
# catches Error, so an OOM kills whichever thread it lands on -- the poll loop,
# a relay socket's -- and the process can live on without it, running,
# publishing nothing, and never restarted. With the flag any OOM is an exit,
# which restartPolicyType below turns into a restart.
#
# Setting JAVA_OPTS on the service replaces these defaults outright. The sh -c
# is what expands it.
startCommand = "sh -c 'exec java ${JAVA_OPTS:--Xms32m -Xmx192m -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError} -cp boostbox.jar boostbox.nostrbot'"

# No healthcheckPath on purpose -- see above.

# The bot is a long-lived poll loop. If it exits it has lost its wallet
# connection, and the cursor in S3 means a restart resumes rather than
# replaying.
restartPolicyType = "ALWAYS"

# One process, one wallet cursor. Two replicas would both poll the same wallet
# and race on the same state file, publishing duplicate notes.
numReplicas = 1
